---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    pushgateway_release: "{{ pushgateway_defaults_release | combine(pushgateway_release, recursive=True) }}"
  no_log: true

- name: resolve pushgateway release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ pushgateway_release.provider }}"
    host: "{{ pushgateway_release.host }}"
    project: "{{ pushgateway_release.project }}"
    repository: "{{ pushgateway_release.repository }}"
    version: "{{ pushgateway_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _pushgateway_scm_user | default(omit, true) }}"
    password: "{{ _pushgateway_scm_token | default(omit, true) }}"
  register: _pushgateway_release

- name: re-define pushgateway_version
  when:
    - not running_in_check_mode
    - pushgateway_version == "latest"
    - _pushgateway_release.version is defined
    - _pushgateway_release.version | length > 0
  ansible.builtin.set_fact:
    pushgateway_version: "{{ _pushgateway_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - pushgateway_direct_download
  ansible.builtin.set_fact:
    pushgateway_delegate_to: "{{ ansible_facts.host }}"
    pushgateway_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/pushgateway', true) }}/{{ pushgateway_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ pushgateway_delegate_to }}"
  run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ pushgateway_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded pushgateway archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ pushgateway_delegate_to }}"
  run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ pushgateway_local_tmp_directory }}/{{ _pushgateway_release.file }}"
  register: pushgateway_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - pushgateway_stat_archive.stat is defined
    - not pushgateway_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download pushgateway binary archive
      become: false
      delegate_to: "{{ pushgateway_delegate_to }}"
      run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _pushgateway_release.download_url }}"
        url_username: "{{ _pushgateway_scm_user | default(omit, true) }}"
        url_password: "{{ _pushgateway_scm_token | default(omit, true) }}"
        dest: "{{ pushgateway_local_tmp_directory }}/{{ _pushgateway_release.file }}"
        checksum: "{{ _pushgateway_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ pushgateway_delegate_to }}"
      run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ pushgateway_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ pushgateway_delegate_to }}"
  run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ pushgateway_local_tmp_directory }}/{{ _pushgateway_release.file }}"
  register: pushgateway_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ pushgateway_delegate_to }}"
  run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ pushgateway_local_tmp_directory }}/{{ pushgateway_release.binary }}"
  register: pushgateway_stat_binary

- name: extract pushgateway archive
  when:
    - not running_in_check_mode
    - pushgateway_stat_archive.stat is defined
    - pushgateway_stat_archive.stat.exists | default('false') | bool
    - pushgateway_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - pushgateway_stat_binary.stat is defined
    - not pushgateway_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ pushgateway_delegate_to }}"
  run_once: "{{ 'false' if pushgateway_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ pushgateway_local_tmp_directory }}/{{ _pushgateway_release.file }}"
    dest: "{{ pushgateway_local_tmp_directory }}/"
    remote_src: "{{ 'true' if pushgateway_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

...
