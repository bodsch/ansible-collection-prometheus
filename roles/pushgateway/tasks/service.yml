---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure pushgateway is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: pushgateway
    state: "{{ pushgateway_system_service.state | default('started') }}"
    enabled: "{{ pushgateway_system_service.enabled | default(true) | bool }}"

...
