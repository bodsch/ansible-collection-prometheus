---

pushgateway_main_version: "{{ pushgateway_version[0:3] }}"

pushgateway_install_path: /usr/local/opt/pushgateway/{{ pushgateway_version }}

pushgateway_delegate_to: localhost

pushgateway_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/pushgateway', true) }}/{{ pushgateway_version }}"

pushgateway_requirements:
  - iproute2

pushgateway_defaults_service:
  log:
    level: info
    format: ""
  web:
    config:
      file: ""
    listen_address: "127.0.0.1:9091"
    telemetry_path: ""
    external_url: ""
    route_prefix: ""
    enable_lifecycle: false
    enable_admin_api: false
  persistence:
    file: ""
    interval: 5m
  push:
    disable_consistency_check: false

pushgateway_defaults_directory: /etc/default

pushgateway_defaults_release:
  provider: github
  host: https://github.com
  project:  prometheus
  repository: pushgateway
  file: "pushgateway-{{ pushgateway_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz"
  binary: pushgateway

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'
  armv6l: 'armv6'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

_pushgateway_gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
_pushgateway_gh_user: "{{ lookup('env', 'GH_USER') }}"
_pushgateway_fj_token: "{{ lookup('env', 'FJ_TOKEN') }}"
_pushgateway_fj_user: "{{ lookup('env', 'FJ_USER') }}"

# credentials matching the configured release provider (empty when unset)
_pushgateway_scm_token: "{{ _pushgateway_fj_token if pushgateway_release.provider == 'forgejo' else _pushgateway_gh_token }}"
_pushgateway_scm_user: "{{ _pushgateway_fj_user if pushgateway_release.provider == 'forgejo' else _pushgateway_gh_user }}"

...
