---

- name: daemon-reload
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "systemd"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: restart pushgateway
  when:
    - not running_in_check_mode
    - pushgateway_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: pushgateway
    state: restarted

- name: reload pushgateway
  when:
    - not running_in_check_mode
    - pushgateway_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: pushgateway
    state: reloaded

...
