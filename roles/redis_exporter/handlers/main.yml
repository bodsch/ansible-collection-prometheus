---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: reload redis exporter
  when:
    - not running_in_check_mode
    - redis_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: redis_exporter
    state: reloaded

- name: restart redis exporter
  when:
    - not running_in_check_mode
    - redis_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: redis_exporter
    state: restarted

...
