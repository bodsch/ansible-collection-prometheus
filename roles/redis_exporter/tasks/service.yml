---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure redis_exporter is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: redis_exporter
    state: "{{ redis_exporter_system_service.state | default('started') }}"
    enabled: "{{ redis_exporter_system_service.enabled | default(true) | bool }}"

...
