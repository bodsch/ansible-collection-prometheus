---

- name: daemon-reload
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: reload trickster
  when:
    - not running_in_check_mode
    - trickster_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: trickster
    state: reloaded

- name: restart trickster
  when:
    - not running_in_check_mode
    - trickster_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: trickster
    state: restarted

...
