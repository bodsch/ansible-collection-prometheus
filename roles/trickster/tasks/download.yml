---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    trickster_release: "{{ trickster_defaults_release | combine(trickster_release, recursive=True) }}"
  no_log: true

- name: resolve trickster release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "github"
    project: trickstercache
    repository: trickster
    version: "{{ trickster_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    # asset: "trickster-{version}.{system}-{arch}.tar.gz"
    user: "{{ lookup('env', 'GH_USER') | default(omit) }}"
    password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
  register: _release

- name: re-define trickster_version
  when:
    - not running_in_check_mode
    - trickster_version == "latest"
    - _release.version is defined
    - _release.version | length > 0
  ansible.builtin.set_fact:
    trickster_version: "{{ _release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - trickster_direct_download
  ansible.builtin.set_fact:
    trickster_delegate_to: "{{ ansible_facts.host }}"
    trickster_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/trickster', true) }}/{{ trickster_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ trickster_delegate_to }}"
  run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ trickster_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded trickster archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ trickster_delegate_to }}"
  run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ trickster_local_tmp_directory }}/{{ _release.file }}"
  register: trickster_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - trickster_stat_archive.stat is defined
    - not trickster_stat_archive.stat.exists | default(false) | bool
  block:

    - name: download trickster binary archive
      become: false
      delegate_to: "{{ trickster_delegate_to }}"
      run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _release.download_url }}"
        url_username: "{{ lookup('env', 'GH_USER') | default(omit) }}"
        url_password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
        dest: "{{ trickster_local_tmp_directory }}/{{ _release.file }}"
        checksum: "{{ _release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ trickster_delegate_to }}"
      run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ trickster_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ trickster_delegate_to }}"
  run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ trickster_local_tmp_directory }}/{{ _release.file }}"
  register: trickster_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ trickster_delegate_to }}"
  run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ trickster_local_tmp_directory }}/bin/{{ trickster_release.binary }}"
  register: trickster_stat_binary

- name: extract trickster archive
  when:
    - not running_in_check_mode
    - trickster_stat_archive.stat is defined
    - trickster_stat_archive.stat.exists | default('false') | bool
    - trickster_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - trickster_stat_binary.stat is defined
    - not trickster_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ trickster_delegate_to }}"
  run_once: "{{ 'false' if trickster_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ trickster_local_tmp_directory }}/{{ _release.file }}"
    dest: "{{ trickster_local_tmp_directory }}/"
    remote_src: "{{ 'true' if trickster_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

...
