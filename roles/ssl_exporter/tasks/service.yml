---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure ssl_exporter is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: ssl_exporter
    state: "{{ ssl_exporter_system_service.state | default('started') }}"
    enabled: "{{ ssl_exporter_system_service.enabled | default(true) | bool }}"

...
