---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure json_exporter is enabled on boot
  become: true
  when:
    - not running_in_check_mode
  ansible.builtin.service:
    name: json_exporter
    state: "{{ json_exporter_system_service.state | default('started') }}"
    enabled: "{{ json_exporter_system_service.enabled | default(true) | bool }}"

...
