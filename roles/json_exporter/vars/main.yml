---

json_exporter_main_version: "{{ json_exporter_version[0:3] }}"

json_exporter_install_path: /usr/local/opt/json_exporter/{{ json_exporter_version }}

json_exporter_delegate_to: localhost

json_exporter_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/json_exporter', true) }}/{{ json_exporter_version }}"

json_exporter_requirements:
  - iproute2

json_exporter_defaults_config: []
json_exporter_defaults_modules: {}

json_exporter_defaults_service:
  config:
    file: "{{ json_exporter_config_dir }}/config.yml"
  log:
    level: info
    format: ""
  web:
    listen_address: "127.0.0.1:7979"

json_exporter_defaults_directory: /etc/default

json_exporter_defaults_release:
  download_url: https://github.com/prometheus-community/json_exporter/releases
  file: json_exporter-{{ json_exporter_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: json_exporter

go_arch_map:
  i386: '386'
  x86_64: 'amd64'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

_json_exporter_gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
_json_exporter_gh_user: "{{ lookup('env', 'GH_USER') }}"
_json_exporter_fj_token: "{{ lookup('env', 'FJ_TOKEN') }}"
_json_exporter_fj_user: "{{ lookup('env', 'FJ_USER') }}"

# credentials matching the configured release provider (empty when unset)
_json_exporter_scm_token: "{{ _json_exporter_fj_token if json_exporter_release.provider == 'forgejo' else _json_exporter_gh_token }}"
_json_exporter_scm_user: "{{ _json_exporter_fj_user if json_exporter_release.provider == 'forgejo' else _json_exporter_gh_user }}"

...
