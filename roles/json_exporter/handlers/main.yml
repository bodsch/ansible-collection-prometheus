---

- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    force: true
  notify: restart json_exporter

- name: verify configuration  # noqa no-changed-when
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.command: |
    json_exporter \
      --config.check \
      --config.file={{ json_exporter_service.config.file }}

- name: reload json exporter
  when:
    - not running_in_check_mode
    - json_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: json_exporter
    state: reloaded

- name: restart json exporter
  when:
    - not running_in_check_mode
    - json_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: json_exporter
    state: restarted

...
