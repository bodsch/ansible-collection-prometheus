---

mongodb_exporter_main_version: "{{ mongodb_exporter_version[0:3] }}"

mongodb_exporter_install_path: /usr/local/opt/mongodb_exporter/{{ mongodb_exporter_version }}

mongodb_exporter_delegate_to: localhost

mongodb_exporter_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/mongodb_exporter', true) }}/{{ mongodb_exporter_version }}"

mongodb_exporter_config_dir: /etc/mongodb_exporter

mongodb_exporter_packages: []

mongodb_exporter_requirements:
  - iproute2

mongodb_exporter_defaults_directory: /etc/default

mongodb_exporter_defaults_release:
  provider: github
  host: https://github.com
  project:  percona
  repository: mongodb_exporter
  file: mongodb_exporter-{{ mongodb_exporter_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: mongodb_exporter

mongodb_exporter_defaults_credentials:
  client:
    hostname: ""
    port: ""
    socket: ""
    username: ""
    password: ""

mongodb_exporter_defaults_service:
  log:
    level: info
    format: ""
  web:
    listen_address: "127.0.0.1:9216"
    telemetry_path: /metrics
    config: ""
  collector_all: ""                         # [true|false]
  collector:
    diagnosticdata: ""                      # [true|false]
    replicasetstatus: ""                    # [true|false]
    dbstats: ""                             # [true|false]
    topmetrics: ""                          # [true|false]
    indexstats: ""                          # [true|false]
    collstats: ""                           # [true|false]
    collstats_limit: ""                     # 0
  metrics:
    overridedescendingindex: ""             # [true|false]
  mongodb:
    collstats_colls: []                     #
    indexstats_colls: []                    #
    uri: "mongodb://user:pass@127.0.0.1:27017/admin?ssl=true"
    global_conn_pool: ""                    # [true|false]
    direct_connect: ""                      # [true|false]
  discovering_mode: ""                      # [true|false]
  compatible_mode: ""                       # [true|false]
  raw_flags: {}

# ------------------------------------------------------------------------

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'
  armv6l: 'armv6'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

_mongodb_exporter_gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
_mongodb_exporter_gh_user: "{{ lookup('env', 'GH_USER') }}"
_mongodb_exporter_fj_token: "{{ lookup('env', 'FJ_TOKEN') }}"
_mongodb_exporter_fj_user: "{{ lookup('env', 'FJ_USER') }}"

# credentials matching the configured release provider (empty when unset)
_mongodb_exporter_scm_token: "{{ _mongodb_exporter_fj_token if mongodb_exporter_release.provider == 'forgejo' else _mongodb_exporter_gh_token }}"
_mongodb_exporter_scm_user: "{{ _mongodb_exporter_fj_user if mongodb_exporter_release.provider == 'forgejo' else _mongodb_exporter_gh_user }}"

...
