---

- name: daemon-reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: reload docker-sd
  when:
    - not running_in_check_mode
    - docker_sd_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: docker-sd
    state: reloaded

- name: restart docker-sd
  when:
    - not running_in_check_mode
    - docker_sd_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: docker-sd
    state: restarted
...
