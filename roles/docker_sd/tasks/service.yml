---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure docker-sd is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: docker-sd
    state: "{{ docker_sd_system_service.state | default('started') }}"
    enabled: "{{ docker_sd_system_service.enabled | default(true) | bool }}"

...
