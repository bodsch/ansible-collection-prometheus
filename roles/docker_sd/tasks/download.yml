---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    docker_sd_release: "{{ docker_sd_defaults_release | combine(docker_sd_release, recursive=True) }}"
  no_log: true

- name: resolve docker_sd release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ docker_sd_release.provider }}"
    host: "{{ docker_sd_release.host }}"
    project: "{{ docker_sd_release.project }}"
    repository: "{{ docker_sd_release.repository }}"
    version: "{{ docker_sd_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ lookup('env', 'GH_USER') | default(omit) }}"
    password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
  register: _docker_sd_release

- name: re-define docker_sd_version
  when:
    - not running_in_check_mode
    - docker_sd_version == "latest"
    - _docker_sd_release.version is defined
    - _docker_sd_release.version | length > 0
  ansible.builtin.set_fact:
    docker_sd_version: "{{ _docker_sd_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - docker_sd_direct_download
  ansible.builtin.set_fact:
    docker_sd_delegate_to: "{{ ansible_facts.host }}"
    docker_sd_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/docker_sd', true) }}/{{ docker_sd_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ docker_sd_delegate_to }}"
  run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ docker_sd_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded docker_sd archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ docker_sd_delegate_to }}"
  run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ docker_sd_local_tmp_directory }}/{{ _docker_sd_release.file }}"
  register: docker_sd_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - docker_sd_stat_archive.stat is defined
    - not docker_sd_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download docker_sd binary archive
      become: false
      delegate_to: "{{ docker_sd_delegate_to }}"
      run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _docker_sd_release.download_url }}"
        url_username: "{{ lookup('env', 'GH_USER') | default(omit) }}"
        url_password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
        dest: "{{ docker_sd_local_tmp_directory }}/{{ _docker_sd_release.file }}"
        checksum: "{{ _docker_sd_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ docker_sd_delegate_to }}"
      run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ docker_sd_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ docker_sd_delegate_to }}"
  run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ docker_sd_local_tmp_directory }}/{{ _docker_sd_release.file }}"
  register: docker_sd_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ docker_sd_delegate_to }}"
  run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ docker_sd_local_tmp_directory }}/{{ docker_sd_release.binary }}"
  register: docker_sd_stat_binary

- name: extract docker_sd archive
  when:
    - not running_in_check_mode
    - docker_sd_stat_archive.stat is defined
    - docker_sd_stat_archive.stat.exists | default('false') | bool
    - docker_sd_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - docker_sd_stat_binary.stat is defined
    - not docker_sd_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ docker_sd_delegate_to }}"
  run_once: "{{ 'false' if docker_sd_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ docker_sd_local_tmp_directory }}/{{ _docker_sd_release.file }}"
    dest: "{{ docker_sd_local_tmp_directory }}/"
    remote_src: "{{ 'true' if docker_sd_direct_download else 'false' }}"
    # extra_opts:
    #   - --strip-components=1

...
