---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    alertmanager_release: "{{ alertmanager_defaults_release | combine(alertmanager_release, recursive=True) }}"
  no_log: true

- name: resolve alertmanager release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ alertmanager_release.provider }}"
    host: "{{ alertmanager_release.host }}"
    project: "{{ alertmanager_release.project }}"
    repository: "{{ alertmanager_release.repository }}"
    version: "{{ alertmanager_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ lookup('env', 'GH_USER') | default(omit) }}"
    password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
  register: _alertmanager_release

- name: re-define alertmanager_version
  when:
    - not running_in_check_mode
    - alertmanager_version == "latest"
    - _alertmanager_release.version is defined
    - _alertmanager_release.version | length > 0
  ansible.builtin.set_fact:
    alertmanager_version: "{{ _alertmanager_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - alertmanager_direct_download
  ansible.builtin.set_fact:
    alertmanager_delegate_to: "{{ ansible_facts.host }}"
    alertmanager_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/alertmanager', true) }}/{{ alertmanager_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ alertmanager_delegate_to }}"
  run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ alertmanager_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded alertmanager archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ alertmanager_delegate_to }}"
  run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ alertmanager_local_tmp_directory }}/{{ _alertmanager_release.file }}"
  register: alertmanager_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - alertmanager_stat_archive.stat is defined
    - not alertmanager_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download alertmanager binary archive
      become: false
      delegate_to: "{{ alertmanager_delegate_to }}"
      run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _alertmanager_release.download_url }}"
        url_username: "{{ lookup('env', 'GH_USER') | default(omit) }}"
        url_password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
        dest: "{{ alertmanager_local_tmp_directory }}/{{ _alertmanager_release.file }}"
        checksum: "{{ _alertmanager_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ alertmanager_delegate_to }}"
      run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ alertmanager_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ alertmanager_delegate_to }}"
  run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ alertmanager_local_tmp_directory }}/{{ _alertmanager_release.file }}"
  register: alertmanager_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ alertmanager_delegate_to }}"
  run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ alertmanager_local_tmp_directory }}/{{ alertmanager_release.binary }}"
  register: alertmanager_stat_binary

- name: extract alertmanager archive
  when:
    - not running_in_check_mode
    - alertmanager_stat_archive.stat is defined
    - alertmanager_stat_archive.stat.exists | default('false') | bool
    - alertmanager_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - alertmanager_stat_binary.stat is defined
    - not alertmanager_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ alertmanager_delegate_to }}"
  run_once: "{{ 'false' if alertmanager_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ alertmanager_local_tmp_directory }}/{{ _alertmanager_release.file }}"
    dest: "{{ alertmanager_local_tmp_directory }}/"
    remote_src: "{{ 'true' if alertmanager_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

...
