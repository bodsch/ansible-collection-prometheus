---

alertmanager_version: 0.34.2

# alertmanager_state: installed

alertmanager_system_user:
  owner: alertmanager
  group: alertmanager

alertmanager_system_service:
  state: started
  enabled: true

alertmanager_config_dir: /etc/alertmanager
alertmanager_data_dir: /var/lib/alertmanager

alertmanager_enable_experimental: false

alertmanager_direct_download: false

alertmanager_release:
  provider: github
  host: https://github.com
  project:  prometheus
  repository: alertmanager
  file: "alertmanager-{{ alertmanager_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz"
  binary: alertmanager

alertmanager_amtool: {}

alertmanager_service: {}
alertmanager_global: {}
alertmanager_templates:
  - '{{ alertmanager_config_dir }}/templates/*.tmpl'

alertmanager_receivers: []
alertmanager_routes: {}
alertmanager_inhibit_rules: []
alertmanager_time_intervals: {}

...
