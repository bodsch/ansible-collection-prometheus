---

alertmanager_main_version: "{{ alertmanager_version[0:3] }}"

alertmanager_install_path: /usr/local/opt/alertmanager/{{ alertmanager_version }}

alertmanager_delegate_to: localhost

alertmanager_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/alertmanager', true) }}/{{ alertmanager_version }}"

alertmanager_requirements:
  - iproute2
  - gzip
  # - python3-jinja2

alertmanager_defaults_amtool:
  config_dir: /etc/amtool
  # Location (URL) of the alertmanager
  alertmanager_url: "{{ alertmanager_service.web.external_url }}"
  # Extended output of `amtool` commands, use '' for less verbosity
  output: extended

alertmanager_defaults_service:
  log:
    level: info
    format: ""
  storage:
    path: /var/lib/alertmanager
  data:
    retention: 120h
    maintenance_interval: 15m
  web:
    # [EXPERIMENTAL]
    # Path to configuration file that can enable TLS or authentication.
    config:
      file: ""
    # The URL under which Alertmanager is externally reachable (for example, if Alertmanager is served via a reverse proxy). Used for generating relative and
    # absolute links back to Alertmanager itself. If the URL has a path portion, it will be used to prefix all HTTP endpoints served by Alertmanager. If omitted,
    # relevant URL components will be derived automatically.
    external_url: ""
    # Addresses on which to expose metrics and web interface. Repeatable for multiple addresses.
    listen_address: "127.0.0.1:9093"
    # Prefix for the internal routes of web endpoints. Defaults to path of --web.external-url.
    route_prefix: ""
    # Maximum number of GET requests processed concurrently. If negative or zero, the limit is GOMAXPROC or 8, whichever is larger.
    get_concurrency: 0
    # Timeout for HTTP requests. If negative or zero, no timeout is set.
    timeout: ""
    # Use systemd socket activation listeners instead of port listeners (Linux only).
    systemd_socket: false

  cluster:
    listen_address: ""                                        # "0.0.0.0:9094"  | Listen address for cluster. Set to empty string to disable HA mode.
    advertise_address: ""                                     # CLUSTER.ADVERTISE-ADDRESS | Explicit address to advertise in cluster.
    peer: []                                                  # CLUSTER.PEER ... | Initial peers (may be repeated).
    peer_timeout: ""                                          # 15s | Time to wait between peers to send notifications.
    gossip_interval: ""                                       # 200ms | Interval between sending gossip messages. By lowering this value (more frequent) gossip messages are propagated across the cluster more quickly at the
                                                              #    expense of increased bandwidth.
    pushpull_interval: ""                                     # 1m0s | Interval for gossip state syncs. Setting this interval lower (more frequent) will increase convergence speeds across larger clusters at the expense of
                                                              # increased bandwidth usage.
    tcp_timeout: ""                                           # 10s | Timeout for establishing a stream connection with a remote node for a full state sync, and for stream read and write operations.
    probe_timeout: ""                                         # 500ms | Timeout to wait for an ack from a probed node before assuming it is unhealthy. This should be set to 99-percentile of RTT (round-trip time) on your network.
    probe_interval: ""                                        # 1s | Interval between random node probes. Setting this lower (more frequent) will cause the cluster to detect failed nodes more quickly at the expense of
                                                              # increased bandwidth usage.
    settle_timeout: ""                                        # 1m0s | Maximum time to wait for cluster connections to settle before evaluating notifications.
    reconnect_interval: ""                                    # 10s | Interval between attempting to reconnect to lost peers.
    reconnect_timeout: ""                                     # 6h0m0s | Length of time to attempt to reconnect to a lost peer.
    tls_config: ""                                            #  | [EXPERIMENTAL] Path to config yaml file that can enable mutual TLS within the gossip protocol.
    allow_insecure_public_advertise_address_discovery: false  #  | [EXPERIMENTAL] Allow alertmanager to discover and listen on a public IP address.

  raw_flags: {}

alertmanager_defaults_global:
  smtp:
    # The default SMTP From header field.
    from: ""
    # The default SMTP smarthost used for sending emails, including port number.
    # Port number usually is 25, or 587 for SMTP over TLS (sometimes referred to as STARTTLS).
    # Example: smtp.example.org:587
    smarthost: ""
    # The default hostname to identify to the SMTP server.
    hello: "localhost"
    # SMTP Auth using CRAM-MD5, LOGIN and PLAIN. If empty, Alertmanager doesn't authenticate to the SMTP server.
    auth:
      username: ""
      # SMTP Auth using LOGIN and PLAIN.
      password: ""
      # SMTP Auth using LOGIN and PLAIN.
      password_file: ""
      # SMTP Auth using PLAIN.
      identity: ""
      # SMTP Auth using CRAM-MD5.
      secret: ""
    # The default SMTP TLS requirement.
    # Note that Go does not support unencrypted connections to remote SMTP endpoints.
    require_tls: true
  slack:
    # The API URL to use for Slack notifications.
    api_url: ""
    api_url_file: ""
  victorops:
    api_key: ""
    api_key_file: ""
    # default = "https://alert.victorops.com/integrations/generic/20131114/alert/" ]
    api_url: ""
  pagerduty:
    # default = "https://events.pagerduty.com/v2/enqueue"
    url: ""
  opsgenie:
    api_key: ""
    api_key_file: ""
    # default = "https://api.opsgenie.com/"
    api_url: ""
  wechat:
    # default = "https://qyapi.weixin.qq.com/cgi-bin/"
    api_url: ""
    api_secret: ""
    api_corp_id: ""
  telegram:
    # default = "https://api.telegram.org"
    api_url: ""
  webex:
    # default = "https://webexapis.com/v1/messages"
    api_url: ""
  # The default HTTP client configuration
  http_config: ""
  resolve_timeout: 5m

alertmanager_defaults_receivers:
  blackhole: {}

alertmanager_defaults_routes:
  group_by: []
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  default_receiver: blackhole
  routes: []

alertmanager_defaults_inhibit_rules: {}
alertmanager_defaults_time_intervals: {}

alertmanager_defaults_directory: /etc/default

alertmanager_defaults_release:
  download_url: https://github.com/prometheus/alertmanager/releases
  file: "alertmanager-{{ alertmanager_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz"
  binary: alertmanager

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'
  armv6l: 'armv6'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

...
