---

- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    force: true
  notify: restart blackbox_exporter

- name: validate blackbox config  # noqa no-handler
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.command: |
    /usr/bin/blackbox_exporter \
      --config.file {{ blackbox_exporter_service.config.file }} \
      --config.check
  register: _validate
  changed_when: _validate.rc != 0
  failed_when: _validate.rc != 0

- name: restart blackbox exporter
  when:
    - not running_in_check_mode
    - blackbox_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: blackbox_exporter
    state: restarted

- name: reload blackbox exporter
  when:
    - not running_in_check_mode
    - blackbox_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: blackbox_exporter
    state: reloaded

...
