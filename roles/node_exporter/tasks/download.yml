---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    node_exporter_release: "{{ node_exporter_defaults_release | combine(node_exporter_release, recursive=True) }}"
  no_log: true

- name: resolve node_exporter release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ node_exporter_release.provider }}"
    host: "{{ node_exporter_release.host }}"
    project: "{{ node_exporter_release.project }}"
    repository: "{{ node_exporter_release.repository }}"
    version: "{{ node_exporter_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _node_exporter_scm_user | default(omit, true) }}"
    password: "{{ _node_exporter_scm_token | default(omit, true) }}"
  register: _node_exporter_release

- name: re-define node_exporter_version
  when:
    - not running_in_check_mode
    - node_exporter_version == "latest"
    - _node_exporter_release.version is defined
    - _node_exporter_release.version | length > 0
  ansible.builtin.set_fact:
    node_exporter_version: "{{ _node_exporter_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - node_exporter_direct_download
  ansible.builtin.set_fact:
    node_exporter_delegate_to: "{{ ansible_facts.host }}"
    node_exporter_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/node_exporter', true) }}/{{ node_exporter_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ node_exporter_delegate_to }}"
  run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ node_exporter_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded node_exporter archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ node_exporter_delegate_to }}"
  run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ node_exporter_local_tmp_directory }}/{{ _node_exporter_release.file }}"
  register: node_exporter_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - node_exporter_stat_archive.stat is defined
    - not node_exporter_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download node_exporter binary archive
      become: false
      delegate_to: "{{ node_exporter_delegate_to }}"
      run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _node_exporter_release.download_url }}"
        url_username: "{{ _node_exporter_scm_user | default(omit, true) }}"
        url_password: "{{ _node_exporter_scm_token | default(omit, true) }}"
        dest: "{{ node_exporter_local_tmp_directory }}/{{ _node_exporter_release.file }}"
        checksum: "{{ _node_exporter_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ node_exporter_delegate_to }}"
      run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ node_exporter_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ node_exporter_delegate_to }}"
  run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ node_exporter_local_tmp_directory }}/{{ _node_exporter_release.file }}"
  register: node_exporter_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ node_exporter_delegate_to }}"
  run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ node_exporter_local_tmp_directory }}/{{ node_exporter_release.binary }}"
  register: node_exporter_stat_binary

- name: extract node_exporter archive
  when:
    - not running_in_check_mode
    - node_exporter_stat_archive.stat is defined
    - node_exporter_stat_archive.stat.exists | default('false') | bool
    - node_exporter_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - node_exporter_stat_binary.stat is defined
    - not node_exporter_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ node_exporter_delegate_to }}"
  run_once: "{{ 'false' if node_exporter_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ node_exporter_local_tmp_directory }}/{{ _node_exporter_release.file }}"
    dest: "{{ node_exporter_local_tmp_directory }}/"
    remote_src: "{{ 'true' if node_exporter_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

