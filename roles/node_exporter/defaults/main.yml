---

node_exporter_version: "1.10.2"

# node_exporter_state: installed

node_exporter_system_user:
  owner: node-exporter
  group: node-exporter

node_exporter_system_service:
  state: started
  enabled: true

node_exporter_release:
  provider: github
  host: https://github.com
  project:  prometheus
  repository: node_exporter
  file: node_exporter-{{ node_exporter_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: node_exporter

node_exporter_config_dir: /etc/node_exporter
node_exporter_textfile_dir: /var/lib/node_exporter

node_exporter_direct_download: false

node_exporter_enable_experimental: false

node_exporter_service:
  log:
    level: warn
  web:
    listen_address: "0.0.0.0:9100"
    telemetry_path: "/metrics"

# experimental
node_exporter_tls_server: {}
# experimental
node_exporter_http_server: {}
# experimental
node_exporter_basic_auth_users: {}

node_exporter_rules: {}

node_exporter_collectors:
  enabled:
    - textfile:
        directory: "/var/lib/node_exporter"
  #  - filesystem:
  #      ignored-mount-points: "^/(sys|proc|dev)($|/)"
  #      ignored-fs-types: "^(sys|proc|auto)fs$"
  disabled: []

...
