---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr | lower == "systemd"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: restart node exporter
  when:
    - not running_in_check_mode
    - node_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: node_exporter
    state: restarted

- name: reload node exporter
  when:
    - not running_in_check_mode
    - node_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: node_exporter
    state: reloaded

...
