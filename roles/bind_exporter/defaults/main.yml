---

bind_exporter_version: '0.8.0'

# bind_exporter_state: installed

bind_exporter_system_user:
  owner: bind-exporter
  group: bind-exporter

bind_exporter_system_service:
  state: started
  enabled: true

bind_exporter_release:
  provider: github
  host: https://github.com
  project:  prometheus-community
  repository: bind_exporter
  file: bind_exporter-{{ bind_exporter_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: bind_exporter

bind_exporter_direct_download: false

bind_exporter_service: {}

...
