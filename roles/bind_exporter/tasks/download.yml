---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    bind_exporter_release: "{{ bind_exporter_defaults_release | combine(bind_exporter_release, recursive=True) }}"
  no_log: true

- name: resolve bind_exporter release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ bind_exporter_release.provider }}"
    host: "{{ bind_exporter_release.host }}"
    project: "{{ bind_exporter_release.project }}"
    repository: "{{ bind_exporter_release.repository }}"
    version: "{{ bind_exporter_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _bind_exporter_scm_user | default(omit, true) }}"
    password: "{{ _bind_exporter_scm_token | default(omit, true) }}"
  register: _bind_exporter_release

- name: re-define bind_exporter_version
  when:
    - not running_in_check_mode
    - bind_exporter_version == "latest"
    - _bind_exporter_release.version is defined
    - _bind_exporter_release.version | length > 0
  ansible.builtin.set_fact:
    bind_exporter_version: "{{ _bind_exporter_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - bind_exporter_direct_download
  ansible.builtin.set_fact:
    bind_exporter_delegate_to: "{{ ansible_facts.host }}"
    bind_exporter_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/bind_exporter', true) }}/{{ bind_exporter_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ bind_exporter_delegate_to }}"
  run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ bind_exporter_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded bind_exporter archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ bind_exporter_delegate_to }}"
  run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ bind_exporter_local_tmp_directory }}/{{ _bind_exporter_release.file }}"
  register: bind_exporter_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - bind_exporter_stat_archive.stat is defined
    - not bind_exporter_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download bind_exporter binary archive
      become: false
      delegate_to: "{{ bind_exporter_delegate_to }}"
      run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _bind_exporter_release.download_url }}"
        url_username: "{{ _bind_exporter_scm_user | default(omit, true) }}"
        url_password: "{{ _bind_exporter_scm_token | default(omit, true) }}"
        dest: "{{ bind_exporter_local_tmp_directory }}/{{ _bind_exporter_release.file }}"
        checksum: "{{ _bind_exporter_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ bind_exporter_delegate_to }}"
      run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ bind_exporter_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ bind_exporter_delegate_to }}"
  run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ bind_exporter_local_tmp_directory }}/{{ _bind_exporter_release.file }}"
  register: bind_exporter_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ bind_exporter_delegate_to }}"
  run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ bind_exporter_local_tmp_directory }}/{{ bind_exporter_release.binary }}"
  register: bind_exporter_stat_binary

- name: extract bind_exporter archive
  when:
    - not running_in_check_mode
    - bind_exporter_stat_archive.stat is defined
    - bind_exporter_stat_archive.stat.exists | default('false') | bool
    - bind_exporter_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - bind_exporter_stat_binary.stat is defined
    - not bind_exporter_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ bind_exporter_delegate_to }}"
  run_once: "{{ 'false' if bind_exporter_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ bind_exporter_local_tmp_directory }}/{{ _bind_exporter_release.file }}"
    dest: "{{ bind_exporter_local_tmp_directory }}/"
    remote_src: "{{ 'true' if bind_exporter_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

...
