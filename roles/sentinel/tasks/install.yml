---

- name: user and group handling
  when:
    - not running_in_check_mode
    - sentinel_system_user != "root" or sentinel_system_group != "root"
  block:
    - name: create sentinel group
      ansible.builtin.group:
        name: "{{ sentinel_system_group }}"
        state: present
        system: true
      when:
        - sentinel_system_group != "root"

    - name: create sentinel user
      ansible.builtin.user:
        name: "{{ sentinel_system_user }}"
        groups: "{{ sentinel_system_group }}"
        append: true
        shell: /usr/sbin/nologin
        system: true
        createhome: false
        home: /nonexistent
      when:
        - sentinel_system_user != "root"

- name: create install directory
  when:
    - not running_in_check_mode
  ansible.builtin.file:
    path: "{{ sentinel_install_path }}"
    state: directory
    owner: "{{ sentinel_system_user }}"
    group: "{{ sentinel_system_group }}"
    mode: "0755"

- name: deploy and activate sentinel version {{ sentinel_version }}
  when:
    - not running_in_check_mode
  bodsch.core.deploy_and_activate:
    src_dir: "{{ sentinel_local_tmp_directory }}"
    install_dir: "{{ sentinel_install_path }}"
    link_dir: "/usr/bin"
    remote_src: "{{ ('true' if sentinel_direct_download else 'false') | bool }}"
    owner: "{{ sentinel_system_user }}"
    group: "{{ sentinel_system_group }}"
    mode: "0755"
    items:
      - name: "{{ sentinel_release.binary }}"
        capability: "cap_net_raw+ep"
  notify:
    - restart sentinel

- name: merge sentinel configuration between defaults and custom
  ansible.builtin.set_fact:
    sentinel_service: "{{ sentinel_defaults_service | combine(sentinel_service, recursive=True) }}"

- name: systemd
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "systemd"
  block:
    - name: create sentinel run configuration
      ansible.builtin.template:
        src: "default/sentinel.j2"
        dest: "{{ sentinel_defaults_directory }}/sentinel"
        force: true
        owner: root
        group: "{{ sentinel_system_group }}"
        mode: "0640"
      notify:
        - restart sentinel

    - name: create systemd service unit
      ansible.builtin.template:
        src: "init/systemd/sentinel.service.j2"
        dest: "{{ systemd_lib_directory }}/sentinel.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon-reload
        - restart sentinel

- name: openrc
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "openrc"
  block:
    - name: create openrc service configuration
      ansible.builtin.template:
        src: "init/openrc/conf.d/sentinel.j2"
        dest: "/etc/conf.d/sentinel"
        owner: root
        group: root
        mode: "0644"

    - name: create openrc init configuration
      ansible.builtin.template:
        src: "init/openrc/init.d/sentinel.j2"
        dest: "/etc/init.d/sentinel"
        owner: root
        group: root
        mode: "0750"

- name: create custom fact file
  when:
    - not running_in_check_mode
  bodsch.core.facts:
    name: sentinel
    facts:
      version: "{{ sentinel_version }}"

...
