---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    sentinel_release: "{{ sentinel_defaults_release | combine(sentinel_release, recursive=True) }}"
  no_log: true

- name: resolve sentinel release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ sentinel_release.provider }}"
    host: "{{ sentinel_release.host }}"
    project: "{{ sentinel_release.project }}"
    repository: "{{ sentinel_release.repository }}"
    version: "{{ sentinel_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _sentinel_scm_user | default(omit, true) }}"
    password: "{{ _sentinel_scm_token | default(omit, true) }}"
  register: _sentinel_release

- name: re-define sentinel_version
  when:
    - not running_in_check_mode
    - sentinel_version == "latest"
    - _sentinel_release.version is defined
    - _sentinel_release.version | length > 0
  ansible.builtin.set_fact:
    sentinel_version: "{{ _sentinel_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - sentinel_direct_download
  ansible.builtin.set_fact:
    sentinel_delegate_to: "{{ ansible_facts.host }}"
    sentinel_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/sentinel', true) }}/{{ sentinel_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ sentinel_delegate_to }}"
  run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ sentinel_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded sentinel archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ sentinel_delegate_to }}"
  run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ sentinel_local_tmp_directory }}/{{ _sentinel_release.file }}"
  register: sentinel_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - sentinel_stat_archive.stat is defined
    - not sentinel_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download sentinel binary archive
      become: false
      delegate_to: "{{ sentinel_delegate_to }}"
      run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _sentinel_release.download_url }}"
        url_username: "{{ _sentinel_scm_user | default(omit, true) }}"
        url_password: "{{ _sentinel_scm_token | default(omit, true) }}"
        dest: "{{ sentinel_local_tmp_directory }}/{{ _sentinel_release.file }}"
        checksum: "{{ _sentinel_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ sentinel_delegate_to }}"
      run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ sentinel_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ sentinel_delegate_to }}"
  run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ sentinel_local_tmp_directory }}/{{ _sentinel_release.file }}"
  register: sentinel_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ sentinel_delegate_to }}"
  run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ sentinel_local_tmp_directory }}/{{ sentinel_release.binary }}"
  register: sentinel_stat_binary

- name: extract sentinel archive
  when:
    - not running_in_check_mode
    - sentinel_stat_archive.stat is defined
    - sentinel_stat_archive.stat.exists | default('false') | bool
    - sentinel_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - sentinel_stat_binary.stat is defined
    - not sentinel_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ sentinel_delegate_to }}"
  run_once: "{{ 'false' if sentinel_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ sentinel_local_tmp_directory }}/{{ _sentinel_release.file }}"
    dest: "{{ sentinel_local_tmp_directory }}/"
    remote_src: "{{ 'true' if sentinel_direct_download else 'false' }}"

...
