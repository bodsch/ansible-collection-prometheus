---

sentinel_version: '0.9.0'

# sentinel_state: installed

sentinel_system_user:
  owner: sentinel
  group: sentinel

sentinel_system_service:
  state: started
  enabled: true

sentinel_release:
  provider: github
  host: https://github.com
  project:  bodsch
  repository: sentinel
  file: sentinel-{{ sentinel_version }}-{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: sentinel

sentinel_config_dir: /etc/sentinel

sentinel_direct_download: false

sentinel_service:
  listen: "127.0.0.1:8080"
  log:
    format: "json"
    level: "info"

sentinel_defaults: {}
sentinel_targets: []

...
