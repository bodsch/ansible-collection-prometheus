---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: verify sentinel configuration  # noqa no-changed-when
  become: true
  ansible.builtin.command: |
    sentinel \
      --validate \
      --config {{ sentinel_config_dir }}/config.yml

- name: reload sentinel
  when:
    - not running_in_check_mode
    - sentinel_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: sentinel
    state: reloaded

- name: restart sentinel
  when:
    - not running_in_check_mode
    - sentinel_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: sentinel
    state: restarted

...
