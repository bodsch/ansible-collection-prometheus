---

- name: daemon-reload
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: verify configuration  # noqa no-changed-when
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.command: |
    /bin/true

- name: reload openvpn exporter
  when:
    - not running_in_check_mode
    - openvpn_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: openvpn_exporter
    state: reloaded

- name: restart openvpn exporter
  when:
    - not running_in_check_mode
    - openvpn_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: openvpn_exporter
    state: restarted

...
