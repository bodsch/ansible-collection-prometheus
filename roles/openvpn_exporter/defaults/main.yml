---

openvpn_exporter_version: '1.0.0-rc'

openvpn_exporter_system_user:
  owner:  openvpn-exporter
  group: openvpn-exporter

openvpn_exporter_service:
  state: stopped
  enabled: false

openvpn_exporter_systemd:
  unit:
    after:
      - network.target
    wants: []
    requires: []

openvpn_exporter_config_dir: /etc/openvpn_exporter

openvpn_exporter_release:
  download_url: https://github.com/bodsch/openvpn_exporter/releases
  # file: openvpn_exporter-{{ openvpn_exporter_version }}_{{ ansible_facts.system | lower }}_{{ system_architecture }}.tar.gz
  # binary: openvpn_exporter

openvpn_exporter_service_config:
  log:
    level: info
    format: ""
  web:
    listen_address: "127.0.0.1:9907"
    telemetry_path: "/metrics"
    systemd_socket: ""                              # [true, false]
    config:
      file: ""                                      #
  collector: ""
  journald:
    path: ""
    unit: ""                                        # "openvpn@-.service"
    since: 0s
  openvpn:
    instance: ""                                    # openvpn
  config:
    file: ""

openvpn_exporter_config:
  # openvpn_exporter configuration
  #
  # Each entry in "servers" is one OpenVPN server instance. All metrics carry
  # its name in the "server" label.
  servers: []
#     - name: vpn-udp
#
#       # Source of the client list: either the management interface ...
#       #   OpenVPN server config:  management 127.0.0.1 7505 /etc/openvpn/server/mgmt.pass
#       #                      or:  management /run/openvpn/server.sock unix
#       management:
#         # address: 127.0.0.1:7505              # or tcp://host:port, unix:///run/openvpn/server.sock
#         address: unix:///run/openvpn-server/server.sock
#         # password_file: /etc/openvpn/server/mgmt.pass
#         # password: "..."                    # alternatively inline
#         timeout: 5s
#
#       # ... or a status file (only one of both per server)
#       #   OpenVPN server config:  status /run/openvpn/status.log 10
#       #                           status-version 3
#       # status_file: /run/openvpn/status.log
#
#       # Expiry of these certificates is exported. OpenVPN configs with inline
#       # <ca>/<cert> blocks work as well.
#       certificates:
#         - /etc/openvpn/keys/server/dunkelzahn.matrix.lan.crt
#         - /etc/openvpn/keys/server/ca.crt
#
#       # CRLs used with "crl-verify". An expired CRL locks out ALL clients.
#       crls:
#         - /etc/easy-rsa/pki/crl.pem
#
#       # Clients that should always be connected. Missing ones are exported as
#       # openvpn_client_connections{common_name="..."} 0.
#       expected_clients:
#         - git.boone-schulz.de
#         - web.boone-schulz.de
#         - mail.boone-schulz.de
#
#       # ICMP reachability of clients through the tunnel.
#       ping:
#         connected_clients: true              # ping the virtual IP of every connected client
#         targets:                             # additional fixed addresses (e.g. via ifconfig-push)
#           - name: git.boone-schulz.de
#             address: 172.10.0.11
#           - name: web.boone-schulz.de
#             address: 172.10.0.13
#           - name: mail.boone-schulz.de
#             address: 172.10.0.12
#         count: 3
#         interval: 200ms
#         timeout: 2s
#         privileged: false                    # true = raw socket, needs CAP_NET_RAW
#         concurrency: 16


openvpn_exporter_direct_download: false

...
