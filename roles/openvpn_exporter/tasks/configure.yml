---

- name: create openvpn_exporter directories
  when:
    - not running_in_check_mode
  bodsch.core.directories:
    paths:
      - path: "{{ openvpn_exporter_config_dir }}"

- name: create config.yaml
  when:
    - not running_in_check_mode
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ openvpn_exporter_config_dir }}/config.yml"
    force: true
    owner: "{{ openvpn_exporter_system_user.owner }}"
    group: "{{ openvpn_exporter_system_user.group }}"
    mode: "0640"
    backup: true
  register: _openvpn_exporter_config
  notify:
    - restart openvpn exporter

...
