---

- name: validate config
  bodsch.prometheus.promtool:
    state: check
    config: "{{ prometheus_config_dir }}/prometheus.yml"
  when:
    - not running_in_check_mode

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure prometheus is enabled on boot
  become: true
  when:
    - not running_in_check_mode
  ansible.builtin.service:
    name: prometheus
    state: "{{ prometheus_system_service.state | default('started') }}"
    enabled: "{{ prometheus_system_service.enabled | default(true) | bool }}"


...
