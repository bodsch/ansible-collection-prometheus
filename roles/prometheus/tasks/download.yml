---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    prometheus_release: "{{ prometheus_defaults_release | combine(prometheus_release, recursive=True) }}"
  no_log: true

- name: resolve prometheus release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ prometheus_release.provider }}"
    host: "{{ prometheus_release.host }}"
    project: "{{ prometheus_release.project }}"
    repository: "{{ prometheus_release.repository }}"
    version: "{{ prometheus_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _prometheus_scm_user | default(omit, true) }}"
    password: "{{ _prometheus_scm_token | default(omit, true) }}"
  register: _prometheus_release

- name: re-define prometheus_version
  when:
    - not running_in_check_mode
    - prometheus_version == "latest"
    - _prometheus_release.version is defined
    - _prometheus_release.version | length > 0
  ansible.builtin.set_fact:
    prometheus_version: "{{ _prometheus_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - prometheus_direct_download
  ansible.builtin.set_fact:
    prometheus_delegate_to: "{{ ansible_facts.host }}"
    prometheus_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/prometheus', true) }}/{{ prometheus_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ prometheus_delegate_to }}"
  run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ prometheus_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded prometheus archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ prometheus_delegate_to }}"
  run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ prometheus_local_tmp_directory }}/{{ _prometheus_release.file }}"
  register: prometheus_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - prometheus_stat_archive.stat is defined
    - not prometheus_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download prometheus binary archive
      become: false
      delegate_to: "{{ prometheus_delegate_to }}"
      run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _prometheus_release.download_url }}"
        url_username: "{{ _prometheus_scm_user | default(omit, true) }}"
        url_password: "{{ _prometheus_scm_token | default(omit, true) }}"
        dest: "{{ prometheus_local_tmp_directory }}/{{ _prometheus_release.file }}"
        checksum: "{{ _prometheus_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ prometheus_delegate_to }}"
      run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ prometheus_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ prometheus_delegate_to }}"
  run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ prometheus_local_tmp_directory }}/{{ _prometheus_release.file }}"
  register: prometheus_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ prometheus_delegate_to }}"
  run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ prometheus_local_tmp_directory }}/{{ prometheus_release.binary }}"
  register: prometheus_stat_binary

- name: extract prometheus archive
  when:
    - not running_in_check_mode
    - prometheus_stat_archive.stat is defined
    - prometheus_stat_archive.stat.exists | default('false') | bool
    - prometheus_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - prometheus_stat_binary.stat is defined
    - not prometheus_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ prometheus_delegate_to }}"
  run_once: "{{ 'false' if prometheus_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ prometheus_local_tmp_directory }}/{{ _prometheus_release.file }}"
    dest: "{{ prometheus_local_tmp_directory }}/"
    remote_src: "{{ 'true' if prometheus_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

...
