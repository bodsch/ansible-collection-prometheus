---

promscout_main_version: "{{ promscout_version[0:3] }}"

promscout_install_path: /usr/local/bin/promscout/{{ promscout_version }}

promscout_delegate_to: localhost

promscout_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/promscout', true) }}/{{ promscout_version }}"

promscout_requirements:
  - iproute2
  - gzip

promscout_defaults_directory: /etc/default

promscout_defaults_release:
  provider: github
  host: https://github.com
  project:  bodsch
  repository: promscout
  file: "promscout-{{ promscout_version }}-{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz"
  binary: promscout

# ---------------------------------------------

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'
  armv6l: 'armv6'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

_promscout_gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
_promscout_gh_user: "{{ lookup('env', 'GH_USER') }}"
_promscout_fj_token: "{{ lookup('env', 'FJ_TOKEN') }}"
_promscout_fj_user: "{{ lookup('env', 'FJ_USER') }}"

# credentials matching the configured release provider (empty when unset)
_promscout_scm_token: "{{ _promscout_fj_token if promscout_release.provider == 'forgejo' else _promscout_gh_token }}"
_promscout_scm_user: "{{ _promscout_fj_user if promscout_release.provider == 'forgejo' else _promscout_gh_user }}"

...
