---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr | lower == "systemd"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: reload promscout
  when:
    - not running_in_check_mode
    - promscout_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: promscout
    state: reloaded

- name: restart promscout
  when:
    - not running_in_check_mode
    - promscout_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: promscout
    state: restarted

...
