---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    promscout_release: "{{ promscout_defaults_release | combine(promscout_release, recursive=True) }}"
  no_log: true

- name: resolve promscout release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ promscout_release.provider }}"
    host: "{{ promscout_release.host }}"
    project: "{{ promscout_release.project }}"
    repository: "{{ promscout_release.repository }}"
    version: "{{ promscout_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _promscout_scm_user | default(omit, true) }}"
    password: "{{ _promscout_scm_token | default(omit, true) }}"
  register: _promscout_release

- name: re-define promscout_version
  when:
    - not running_in_check_mode
    - promscout_version == "latest"
    - _promscout_release.version is defined
    - _promscout_release.version | length > 0
  ansible.builtin.set_fact:
    promscout_version: "{{ _promscout_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - promscout_direct_download
  ansible.builtin.set_fact:
    promscout_delegate_to: "{{ ansible_facts.host }}"
    promscout_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/promscout', true) }}/{{ promscout_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promscout_delegate_to }}"
  run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ promscout_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded promscout archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promscout_delegate_to }}"
  run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ promscout_local_tmp_directory }}/{{ _promscout_release.file }}"
  register: promscout_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - promscout_stat_archive.stat is defined
    - not promscout_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download promscout binary archive
      become: false
      delegate_to: "{{ promscout_delegate_to }}"
      run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _promscout_release.download_url }}"
        url_username: "{{ _promscout_scm_user | default(omit, true) }}"
        url_password: "{{ _promscout_scm_token | default(omit, true) }}"
        dest: "{{ promscout_local_tmp_directory }}/{{ _promscout_release.file }}"
        checksum: "{{ _promscout_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ promscout_delegate_to }}"
      run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ promscout_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promscout_delegate_to }}"
  run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ promscout_local_tmp_directory }}/{{ _promscout_release.file }}"
  register: promscout_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promscout_delegate_to }}"
  run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ promscout_local_tmp_directory }}/{{ promscout_release.binary }}"
  register: promscout_stat_binary

- name: extract promscout archive
  when:
    - not running_in_check_mode
    - promscout_stat_archive.stat is defined
    - promscout_stat_archive.stat.exists | default('false') | bool
    - promscout_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - promscout_stat_binary.stat is defined
    - not promscout_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ promscout_delegate_to }}"
  run_once: "{{ 'false' if promscout_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ promscout_local_tmp_directory }}/{{ _promscout_release.file }}"
    dest: "{{ promscout_local_tmp_directory }}/"
    remote_src: "{{ 'true' if promscout_direct_download else 'false' }}"

...
