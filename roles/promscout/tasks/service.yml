---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure promscout is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: promscout
    state: "{{ promscout_system_service.state | default('started') }}"
    enabled: "{{ promscout_system_service.enabled | default(true) | bool }}"

...
