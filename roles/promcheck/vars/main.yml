---

promcheck_main_version: "{{ promcheck_version[0:3] }}"

promcheck_install_path: /usr/local/opt/promcheck/{{ promcheck_version }}

promcheck_delegate_to: localhost

promcheck_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/promcheck', true) }}/{{ promcheck_version }}"

promcheck_requirements:
  - gzip

promcheck_defaults_release:
  provider: github
  host: https://github.com
  project:  cbrgm
  repository: promcheck
  file: "promcheck_{{ ansible_facts.system | lower }}_{{ system_architecture }}.tar.gz"
  binary: promcheck

# ---------------------------------------------

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

_promcheck_gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
_promcheck_gh_user: "{{ lookup('env', 'GH_USER') }}"
_promcheck_fj_token: "{{ lookup('env', 'FJ_TOKEN') }}"
_promcheck_fj_user: "{{ lookup('env', 'FJ_USER') }}"

# credentials matching the configured release provider (empty when unset)
_promcheck_scm_token: "{{ _promcheck_fj_token if promcheck_release.provider == 'forgejo' else _promcheck_gh_token }}"
_promcheck_scm_user: "{{ _promcheck_fj_user if promcheck_release.provider == 'forgejo' else _promcheck_gh_user }}"

...
