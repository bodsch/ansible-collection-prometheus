---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    promcheck_release: "{{ promcheck_defaults_release | combine(promcheck_release, recursive=True) }}"
  no_log: true

- name: resolve promcheck release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ promcheck_release.provider }}"
    host: "{{ promcheck_release.host }}"
    project: "{{ promcheck_release.project }}"
    repository: "{{ promcheck_release.repository }}"
    version: "{{ promcheck_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _promcheck_scm_user | default(omit, true) }}"
    password: "{{ _promcheck_scm_token | default(omit, true) }}"
  register: _promcheck_release

- name: re-define promcheck_version
  when:
    - not running_in_check_mode
    - promcheck_version == "latest"
    - _promcheck_release.version is defined
    - _promcheck_release.version | length > 0
  ansible.builtin.set_fact:
    promcheck_version: "{{ _promcheck_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - promcheck_direct_download
  ansible.builtin.set_fact:
    promcheck_delegate_to: "{{ ansible_facts.host }}"
    promcheck_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/promcheck', true) }}/{{ promcheck_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promcheck_delegate_to }}"
  run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ promcheck_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded promcheck archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promcheck_delegate_to }}"
  run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ promcheck_local_tmp_directory }}/{{ _promcheck_release.file }}"
  register: promcheck_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - promcheck_stat_archive.stat is defined
    - not promcheck_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download promcheck binary archive
      become: false
      delegate_to: "{{ promcheck_delegate_to }}"
      run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _promcheck_release.download_url }}"
        url_username: "{{ _promcheck_scm_user | default(omit, true) }}"
        url_password: "{{ _promcheck_scm_token | default(omit, true) }}"
        dest: "{{ promcheck_local_tmp_directory }}/{{ _promcheck_release.file }}"
        checksum: "{{ _promcheck_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ promcheck_delegate_to }}"
      run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ promcheck_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promcheck_delegate_to }}"
  run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ promcheck_local_tmp_directory }}/{{ _promcheck_release.file }}"
  register: promcheck_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ promcheck_delegate_to }}"
  run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ promcheck_local_tmp_directory }}/{{ promcheck_release.binary }}"
  register: promcheck_stat_binary

- name: extract promcheck archive
  when:
    - not running_in_check_mode
    - promcheck_stat_archive.stat is defined
    - promcheck_stat_archive.stat.exists | default('false') | bool
    - promcheck_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - promcheck_stat_binary.stat is defined
    - not promcheck_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ promcheck_delegate_to }}"
  run_once: "{{ 'false' if promcheck_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ promcheck_local_tmp_directory }}/{{ _promcheck_release.file }}"
    dest: "{{ promcheck_local_tmp_directory }}/"
    remote_src: "{{ 'true' if promcheck_direct_download else 'false' }}"

...
