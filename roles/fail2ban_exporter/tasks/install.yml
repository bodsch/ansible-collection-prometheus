---

- name: merge fail2ban_exporter configuration between defaults and custom
  ansible.builtin.set_fact:
    fail2ban_exporter_service_config: "{{ fail2ban_exporter_defaults_service | combine(fail2ban_exporter_service_config, recursive=True) }}"

- name: user and group handling
  when:
    - not running_in_check_mode
    - fail2ban_exporter_system_user.owner != "root"
  block:
    - name: create fail2ban_exporter group
      ansible.builtin.group:
        name: "{{ fail2ban_exporter_system_user.group }}"
        state: present
        system: true

    - name: create fail2ban_exporter user
      ansible.builtin.user:
        name: "{{ fail2ban_exporter_system_user.owner }}"
        groups: "{{ fail2ban_exporter_system_user.group }}"
        append: true
        shell: /usr/sbin/nologin
        system: true
        createhome: false
        home: /nonexistent

- name: create install directory
  when:
    - not running_in_check_mode
  ansible.builtin.file:
    path: "{{ fail2ban_exporter_install_path }}"
    state: directory
    owner: "{{ fail2ban_exporter_system_user.owner }}"
    group: "{{ fail2ban_exporter_system_user.group }}"
    mode: "0755"

- name: deploy and activate fail2ban_exporter version {{ fail2ban_exporter_version }}
  when:
    - not running_in_check_mode
  bodsch.core.deploy_and_activate:
    src_dir: "{{ fail2ban_exporter_local_tmp_directory }}"
    install_dir: "{{ fail2ban_exporter_install_path }}"
    link_dir: "/usr/bin"
    remote_src: "{{ ('true' if fail2ban_exporter_direct_download else 'false') | bool }}"
    owner: "{{ fail2ban_exporter_system_user.owner }}"
    group: "{{ fail2ban_exporter_system_user.group }}"
    mode: "0755"
    items:
      - name: "{{ fail2ban_exporter_release.binary }}"
        capability: "cap_net_raw+ep"
  notify:
    - restart fail2ban exporter

- name: systemd
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "systemd"
  block:
    - name: create fail2ban_exporter run configuration
      ansible.builtin.template:
        src: "default/fail2ban_exporter.j2"
        dest: "{{ fail2ban_exporter_defaults_directory }}/fail2ban_exporter"
        force: true
        owner: root
        group: "{{ fail2ban_exporter_system_user.group }}"
        mode: "0640"
      notify:
        - restart fail2ban exporter

    - name: create systemd service unit
      ansible.builtin.template:
        src: "init/systemd/fail2ban_exporter.service.j2"
        dest: "{{ systemd_lib_directory }}/fail2ban_exporter.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon-reload
        - restart fail2ban exporter

- name: openrc
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "openrc"
  block:
    - name: create openrc service configuration
      ansible.builtin.template:
        src: "init/openrc/conf.d/fail2ban_exporter.j2"
        dest: "/etc/conf.d/fail2ban_exporter"
        owner: root
        group: root
        mode: "0644"

    - name: create openrc init configuration
      ansible.builtin.template:
        src: "init/openrc/init.d/fail2ban_exporter.j2"
        dest: "/etc/init.d/fail2ban_exporter"
        owner: root
        group: root
        mode: "0750"

- name: create custom fact file
  when:
    - not running_in_check_mode
  bodsch.core.facts:
    name: fail2ban_exporter
    facts:
      version: "{{ fail2ban_exporter_version }}"

...
