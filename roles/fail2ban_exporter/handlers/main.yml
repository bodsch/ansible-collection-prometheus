---

- name: daemon-reload
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true
  notify: restart fail2ban_exporter

- name: verify configuration  # noqa no-changed-when
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.command: |
    /bin/true

- name: reload fail2ban exporter
  when:
    - not running_in_check_mode
    - fail2ban_exporter_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: fail2ban_exporter
    state: reloaded

- name: restart fail2ban exporter
  when:
    - not running_in_check_mode
    - fail2ban_exporter_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: fail2ban_exporter
    state: restarted

...
