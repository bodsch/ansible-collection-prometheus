---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: restart nginx exporter
  when:
    - not running_in_check_mode
    - nginx_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: nginx_exporter
    state: restarted

- name: reload nginx exporter
  when:
    - not running_in_check_mode
    - nginx_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: nginx_exporter
    state: reloaded

...
