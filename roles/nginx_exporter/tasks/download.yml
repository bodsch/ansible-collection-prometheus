---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    nginx_exporter_release: "{{ nginx_exporter_defaults_release | combine(nginx_exporter_release, recursive=True) }}"
  no_log: true

- name: resolve nginx_exporter release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ nginx_exporter_release.provider }}"
    host: "{{ nginx_exporter_release.host }}"
    project: "{{ nginx_exporter_release.project }}"
    repository: "{{ nginx_exporter_release.repository }}"
    version: "{{ nginx_exporter_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _nginx_exporter_scm_user | default(omit, true) }}"
    password: "{{ _nginx_exporter_scm_token | default(omit, true) }}"
  register: _nginx_exporter_release

- name: re-define nginx_exporter_version
  when:
    - not running_in_check_mode
    - nginx_exporter_version == "latest"
    - _nginx_exporter_release.version is defined
    - _nginx_exporter_release.version | length > 0
  ansible.builtin.set_fact:
    nginx_exporter_version: "{{ _nginx_exporter_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - nginx_exporter_direct_download
  ansible.builtin.set_fact:
    nginx_exporter_delegate_to: "{{ ansible_facts.host }}"
    nginx_exporter_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/nginx_exporter', true) }}/{{ nginx_exporter_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ nginx_exporter_delegate_to }}"
  run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ nginx_exporter_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded nginx_exporter archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ nginx_exporter_delegate_to }}"
  run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ nginx_exporter_local_tmp_directory }}/{{ _nginx_exporter_release.file }}"
  register: nginx_exporter_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - nginx_exporter_stat_archive.stat is defined
    - not nginx_exporter_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download nginx_exporter binary archive
      become: false
      delegate_to: "{{ nginx_exporter_delegate_to }}"
      run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _nginx_exporter_release.download_url }}"
        url_username: "{{ _nginx_exporter_scm_user | default(omit, true) }}"
        url_password: "{{ _nginx_exporter_scm_token | default(omit, true) }}"
        dest: "{{ nginx_exporter_local_tmp_directory }}/{{ _nginx_exporter_release.file }}"
        checksum: "{{ _nginx_exporter_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ nginx_exporter_delegate_to }}"
      run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ nginx_exporter_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ nginx_exporter_delegate_to }}"
  run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ nginx_exporter_local_tmp_directory }}/{{ _nginx_exporter_release.file }}"
  register: nginx_exporter_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ nginx_exporter_delegate_to }}"
  run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ nginx_exporter_local_tmp_directory }}/nginx-prometheus-exporter"
  register: nginx_exporter_stat_binary

- name: extract nginx_exporter archive
  when:
    - not running_in_check_mode
    - nginx_exporter_stat_archive.stat is defined
    - nginx_exporter_stat_archive.stat.exists | default('false') | bool
    - nginx_exporter_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - nginx_exporter_stat_binary.stat is defined
    - not nginx_exporter_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ nginx_exporter_delegate_to }}"
  run_once: "{{ 'false' if nginx_exporter_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ nginx_exporter_local_tmp_directory }}/{{ _nginx_exporter_release.file }}"
    dest: "{{ nginx_exporter_local_tmp_directory }}/"
    remote_src: "{{ 'true' if nginx_exporter_direct_download else 'false' }}"

...
