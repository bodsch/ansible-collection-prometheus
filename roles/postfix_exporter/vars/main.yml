---

postfix_exporter_main_version: "{{ postfix_exporter_version[0:3] }}"

postfix_exporter_install_path: /usr/local/opt/postfix_exporter/{{ postfix_exporter_version }}

postfix_exporter_delegate_to: localhost

postfix_exporter_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/postfix_exporter', true) }}/{{ postfix_exporter_version }}"

postfix_exporter_defaults_service:
  log:
    level: info
  web:
    listen_address: "127.0.0.1:9907"
    telemetry_path: "/metrics"
    max_requests: ""                                # 3
    config:
      file: ""                                      #
  config:
    file: ""

postfix_exporter_defaults_config:
  log:
    # "file" for a syslog file or Postfix's own maillog_file,
    # "journal" for the systemd journal (read via journalctl).
    source: file

    file: /var/log/mail.log
    # Poll for changes instead of inotify, e.g. on network file systems.
    poll: false

    journal:
      # Restrict the journal to the Postfix unit. Arch Linux, Fedora:
      # postfix.service; Debian, Ubuntu: postfix@-.service.
      units:
        - postfix.service
      command: journalctl
      directory: /var/log/journal/<machine-id>
    # Postfix's syslog_name (postconf -h syslog_name).
    syslog_name: postfix

  showq:
    # unix:///path for the local socket, tcp://host:port for a showq
    # service exposed in master.cf (protect it, it reveals all addresses).
    address: unix:///var/spool/postfix/public/showq
    timeout: 10s
    disabled: false
  services: {}
    #   smtp: [encrypt]

    # Distinct service names in the "service" label; lines of further
    # services are counted as "other". Any local user can log under the tag
    # "postfix/<anything>", so this protects Prometheus from forged tags.
    # max_services: 100

  replies:
    # Distinct texts per metric; further ones are counted as "other".
    max_texts: 100
    reject: []
    delivery: []
    smtp: []


postfix_exporter_defaults_directory: /etc/default

postfix_exporter_defaults_release:
  provider: github
  host: https://github.com
  project: sergeymakinen
  repository: postfix_exporter
  # download_url: https://github.com/sergeymakinen/postfix_exporter/releases
  file: postfix_exporter-{{ postfix_exporter_version }}_{{ ansible_facts.system | lower }}_{{ system_architecture }}.tar.gz
  binary: postfix_exporter

go_arch_map:
  i386: '386'
  x86_64: 'amd64'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

...
