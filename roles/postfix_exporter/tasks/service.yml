---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure postfix_exporter is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: postfix_exporter
    state: "{{ postfix_exporter_system_service.state | default('started') }}"
    enabled: "{{ postfix_exporter_system_service.enabled | default(true) | bool }}"


...
