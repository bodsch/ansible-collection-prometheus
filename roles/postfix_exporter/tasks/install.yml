---

- name: merge postfix_exporter configuration between defaults and custom
  ansible.builtin.set_fact:
    postfix_exporter_service_config: "{{ postfix_exporter_defaults_service | combine(postfix_exporter_service_config, recursive=True) }}"

- name: user and group handling
  when:
    - not running_in_check_mode
    - postfix_exporter_system_user.owner != "root"
  block:
    - name: create postfix_exporter group
      ansible.builtin.group:
        name: "{{ postfix_exporter_system_user.group }}"
        state: present
        system: true

    - name: create postfix_exporter user
      ansible.builtin.user:
        name: "{{ postfix_exporter_system_user.owner }}"
        groups: "{{ postfix_exporter_system_user.group }}"
        append: true
        shell: /usr/sbin/nologin
        system: true
        createhome: false
        home: /nonexistent

- name: create install directory
  when:
    - not running_in_check_mode
  ansible.builtin.file:
    path: "{{ postfix_exporter_install_path }}"
    state: directory
    owner: "{{ postfix_exporter_system_user.owner }}"
    group: "{{ postfix_exporter_system_user.group }}"
    mode: "0755"

- name: deploy and activate postfix_exporter version {{ postfix_exporter_version }}
  when:
    - not running_in_check_mode
  bodsch.core.deploy_and_activate:
    src_dir: "{{ postfix_exporter_local_tmp_directory }}"
    install_dir: "{{ postfix_exporter_install_path }}"
    link_dir: "/usr/bin"
    remote_src: "{{ ('true' if postfix_exporter_direct_download else 'false') | bool }}"
    owner: "{{ postfix_exporter_system_user.owner }}"
    group: "{{ postfix_exporter_system_user.group }}"
    mode: "0755"
    items:
      - name: "{{ postfix_exporter_release.binary }}"
        capability: "cap_net_raw+ep"
  notify:
    - restart postfix exporter

- name: systemd
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "systemd"
  block:
    - name: create postfix_exporter run configuration
      ansible.builtin.template:
        src: "default/postfix_exporter.j2"
        dest: "{{ postfix_exporter_defaults_directory }}/postfix_exporter"
        force: true
        owner: root
        group: "{{ postfix_exporter_system_user.group }}"
        mode: "0640"
      notify:
        - restart postfix exporter

    - name: create systemd service unit
      ansible.builtin.template:
        src: "init/systemd/postfix_exporter.service.j2"
        dest: "{{ systemd_lib_directory }}/postfix_exporter.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon-reload
        - restart postfix exporter

- name: openrc
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "openrc"
  block:
    - name: create openrc service configuration
      ansible.builtin.template:
        src: "init/openrc/conf.d/postfix_exporter.j2"
        dest: "/etc/conf.d/postfix_exporter"
        owner: root
        group: root
        mode: "0644"

    - name: create openrc init configuration
      ansible.builtin.template:
        src: "init/openrc/init.d/postfix_exporter.j2"
        dest: "/etc/init.d/postfix_exporter"
        owner: root
        group: root
        mode: "0750"

- name: create custom fact file
  when:
    - not running_in_check_mode
  bodsch.core.facts:
    name: postfix_exporter
    facts:
      version: "{{ postfix_exporter_version }}"

...
