---

- name: merge postfix_exporter configuration between defaults and custom
  ansible.builtin.set_fact:
    postfix_exporter_config: "{{ postfix_exporter_defaults_config | combine(postfix_exporter_config, recursive=True) }}"

- name: create postfix_exporter directories
  when:
    - not running_in_check_mode
  bodsch.core.directories:
    paths:
      - path: "{{ postfix_exporter_config_dir }}"

- name: create config.yaml
  when:
    - not running_in_check_mode
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ postfix_exporter_config_dir }}/config.yml"
    force: true
    owner: "{{ postfix_exporter_system_user.owner }}"
    group: "{{ postfix_exporter_system_user.group }}"
    mode: "0640"
    backup: true
  register: _postfix_exporter_config
  notify:
    - restart postfix exporter

...
