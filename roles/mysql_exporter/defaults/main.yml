---

mysql_exporter_version: "0.18.0"

# mysql_exporter_state: installed

mysql_exporter_system_user:
  owner: mysql-exporter
  group: mysql-exporter

mysql_exporter_system_service:
  state: started
  enabled: true

mysql_exporter_direct_download: false

mysql_exporter_release:
  provider: github
  host: https://github.com
  project:  prometheus
  repository: mysqld_exporter
  file: mysqld_exporter-{{ mysql_exporter_version }}.{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: mysqld_exporter

mysql_exporter_service: {}

mysql_exporter_credentials:
  client:
    hostname: ""
    port: ""
    socket: ""
    username: ""
    password: ""

mysql_exporter_collectors: []
#  - global_variables
#  - engine_innodb_status

...
