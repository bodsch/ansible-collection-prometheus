---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr | lower == "systemd"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: reload mysql exporter
  when:
    - not running_in_check_mode
    - mysql_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: mysql_exporter
    state: reloaded

- name: restart mysql exporter
  when:
    - not running_in_check_mode
    - mysql_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: mysql_exporter
    state: restarted

...
