---

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: ensure mysql_exporter is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: mysql_exporter
    state: "{{ mysql_exporter_system_service.state | default('started') }}"
    enabled: "{{ mysql_exporter_system_service.enabled | default(true) | bool }}"

...
