---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: reload logstream exporter
  when:
    - not running_in_check_mode
    - logstream_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: logstream_exporter
    state: reloaded

- name: restart logstream exporter
  when:
    - not running_in_check_mode
    - logstream_exporter_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: logstream_exporter
    state: restarted

...
