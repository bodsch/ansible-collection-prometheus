---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    logstream_exporter_release: "{{ logstream_exporter_defaults_release | combine(logstream_exporter_release, recursive=True) }}"
  no_log: true

- name: resolve logstream_exporter release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ logstream_exporter_release.provider }}"
    host: "{{ logstream_exporter_release.host }}"
    project: "{{ logstream_exporter_release.project }}"
    repository: "{{ logstream_exporter_release.repository }}"
    version: "{{ logstream_exporter_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ lookup('env', 'GH_USER') | default(omit) }}"
    password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
  register: _logstream_exporter_release

- name: re-define logstream_exporter_version
  when:
    - not running_in_check_mode
    - logstream_exporter_version == "latest"
    - _logstream_exporter_release.version is defined
    - _logstream_exporter_release.version | length > 0
  ansible.builtin.set_fact:
    logstream_exporter_version: "{{ _logstream_exporter_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - logstream_exporter_direct_download
  ansible.builtin.set_fact:
    logstream_exporter_delegate_to: "{{ ansible_facts.host }}"
    logstream_exporter_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/logstream_exporter', true) }}/{{ logstream_exporter_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ logstream_exporter_delegate_to }}"
  run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ logstream_exporter_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded logstream_exporter archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ logstream_exporter_delegate_to }}"
  run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ logstream_exporter_local_tmp_directory }}/{{ _logstream_exporter_release.file }}"
  register: logstream_exporter_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - logstream_exporter_stat_archive.stat is defined
    - not logstream_exporter_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download logstream_exporter binary archive
      become: false
      delegate_to: "{{ logstream_exporter_delegate_to }}"
      run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _logstream_exporter_release.download_url }}"
        url_username: "{{ lookup('env', 'GH_USER') | default(omit) }}"
        url_password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
        dest: "{{ logstream_exporter_local_tmp_directory }}/{{ _logstream_exporter_release.file }}"
        checksum: "{{ _logstream_exporter_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ logstream_exporter_delegate_to }}"
      run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ logstream_exporter_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ logstream_exporter_delegate_to }}"
  run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ logstream_exporter_local_tmp_directory }}/{{ _logstream_exporter_release.file }}"
  register: logstream_exporter_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ logstream_exporter_delegate_to }}"
  run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ logstream_exporter_local_tmp_directory }}/{{ logstream_exporter_release.binary }}"
  register: logstream_exporter_stat_binary

- name: extract logstream_exporter archive
  when:
    - not running_in_check_mode
    - logstream_exporter_stat_archive.stat is defined
    - logstream_exporter_stat_archive.stat.exists | default('false') | bool
    - logstream_exporter_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - logstream_exporter_stat_binary.stat is defined
    - not logstream_exporter_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ logstream_exporter_delegate_to }}"
  run_once: "{{ 'false' if logstream_exporter_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ logstream_exporter_local_tmp_directory }}/{{ _logstream_exporter_release.file }}"
    dest: "{{ logstream_exporter_local_tmp_directory }}/"
    remote_src: "{{ 'true' if logstream_exporter_direct_download else 'false' }}"

...
