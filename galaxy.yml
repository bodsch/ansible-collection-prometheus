---

namespace: bodsch
name: prometheus

version: 1.9.0

readme: README.md

authors:
  - Bodo Schulz <bodo@boone-schulz.de>

description: A collection of Ansible roles for the Prometheus universe.

license:
  - Apache-2.0

license_file: ''

tags:
  - monitoring
  - prometheus
  - exporters

dependencies:
  ansible.posix: "*"
  bodsch.core: ">=2.14.2"
  bodsch.scm: ">=1.12.1"
  community.general: "*"

repository: https://github.com/bodsch/ansible-collection-prometheus
documentation: https://github.com/bodsch/ansible-collection-prometheus/README.md
homepage: https://github.com/bodsch/ansible-collection-prometheus
issues: https://github.com/bodsch/ansible-collection-prometheus/issues

build_ignore:
  - "*.pyc"
  - "*.retry"
  - "*/molecule"
  - ".ansible-lint"
  - ".config"
  - ".editorconfig"
  - ".flake8"
  - ".git"
  - ".github"
  - ".gitignore"
  - ".yamllint"
  - "Makefile"
  - "galaxy.yml"
  - "hooks"
  - "test-requirements.txt"
  - "tox.ini"
